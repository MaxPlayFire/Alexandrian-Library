{% extends "Library/base.html" %}

{% block title %}Оцінити роботу{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Оцінити: {{ group.title }}</h1>
    <p class="text-muted">Студент: {{ student.username }}</p>
    
    <form method="post" class="styled-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Бали (0-100)</label>
            <input type="number" name="score" min="0" max="100" 
                   value="{% if grade %}{{ grade.score }}{% else %}0{% endif %}" 
                   class="form-input" required>
        </div>
        
        <div class="form-group">
            <label>Коментар (опціонально)</label>
            <textarea name="feedback" class="form-input" rows="4">{% if grade %}{{ grade.feedback }}{% endif %}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Зберегти
            </button>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fas fa-times"></i> Скасувати
            </a>
        </div>
    </form>
</div>
{% endblock %}
